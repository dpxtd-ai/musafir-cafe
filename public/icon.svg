<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="cup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="steam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer golden accent ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f59e0b" stroke-width="6" opacity="0.4" />

  <!-- Steam curves -->
  <path d="M210 170 Q195 130 220 90 Q205 70 215 50" fill="none" stroke="url(#steam)" stroke-width="12" stroke-linecap="round" />
  <path d="M256 160 Q275 120 250 80 Q270 55 260 40" fill="none" stroke="url(#steam)" stroke-width="14" stroke-linecap="round" />
  <path d="M302 170 Q320 130 295 90 Q315 70 305 50" fill="none" stroke="url(#steam)" stroke-width="12" stroke-linecap="round" />

  <!-- Coffee / Chai Cup body -->
  <path d="M140 210 C140 330 190 375 256 375 C322 375 372 330 372 210 Z" fill="url(#cup)" />

  <!-- Cup Rim -->
  <ellipse cx="256" cy="210" rx="116" ry="24" fill="#fbbf24" stroke="#d97706" stroke-width="4" />
  <ellipse cx="256" cy="210" rx="100" ry="18" fill="#451a03" />

  <!-- Cup Handle -->
  <path d="M360 230 C415 230 425 320 350 330" fill="none" stroke="#f59e0b" stroke-width="24" stroke-linecap="round" />

  <!-- Saucer / Plate -->
  <ellipse cx="256" cy="395" rx="150" ry="20" fill="#ccfbf1" opacity="0.9" />
  <ellipse cx="256" cy="400" rx="170" ry="22" fill="#134e4a" stroke="#f59e0b" stroke-width="6" />

  <!-- Star / Sparkle accents -->
  <path d="M120 140 Q135 140 135 125 Q135 140 150 140 Q135 140 135 155 Q135 140 120 140" fill="#fef08a" />
  <path d="M380 130 Q390 130 390 120 Q390 130 400 130 Q390 130 390 140 Q390 130 380 130" fill="#fef08a" />
</svg>
